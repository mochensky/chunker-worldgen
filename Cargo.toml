[workspace]
resolver = "3"
members = [
    "crates/chunker-nbt",
    "crates/chunker-anvil",
    "crates/chunker-data",
    "crates/chunker-worldgen",
    "xtask",
]
default-members = ["crates/chunker-worldgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mochensky/chunker-worldgen"

[workspace.dependencies]
# internal
chunker-nbt = { path = "crates/chunker-nbt", version = "0.1.0" }
chunker-anvil = { path = "crates/chunker-anvil", version = "0.1.0" }
chunker-data = { path = "crates/chunker-data", version = "0.1.0" }
chunker-worldgen = { path = "crates/chunker-worldgen", version = "0.1.0" }

# external
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tracing = "0.1"
parking_lot = "0.12"
rustc-hash = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
ureq = "2"
rayon = "1"
lz4_flex = "0.11"

[workspace.lints.clippy]
# The port keeps the shape of the decompiled vanilla code on purpose: long parameter lists,
# index loops, `x >= y + 1` forms, and `!(a < b)` comparisons, which differ from `a >= b` for NaN.
too_many_arguments = "allow"
needless_range_loop = "allow"
int_plus_one = "allow"
neg_cmp_op_on_partial_ord = "allow"
# `Interval::add`, `BlockPos::add`, ... mirror vanilla method names; they are not operator impls.
should_implement_trait = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Worldgen is extremely hot; keep it optimized even in debug builds so that
# tests and local runs stay usable.
[profile.dev.package.chunker-worldgen]
opt-level = 3
debug-assertions = true
overflow-checks = false

[profile.dev.package."*"]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
